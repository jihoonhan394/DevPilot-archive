openapi: 3.1.0
info:
  title: DevPilot API
  version: v1
servers:
- url: /
security:
- bearerAuth: []
paths:
  /api/v1/me:
    get:
      operationId: userGetMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Problem Details (docs/05 §1.2)
      tags:
      - user
components:
  schemas:
    FieldError:
      type: object
      properties:
        code:
          type: string
        field:
          type: string
        message:
          type: string
      required:
      - code
      - field
      - message
    MeResponse:
      type: object
      properties:
        email:
          type:
          - string
          - "null"
        sub:
          type: string
      required:
      - email
      - sub
    ProblemDetail:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
        instance:
          type: string
        status:
          type: integer
          format: int32
        title:
          type: string
        traceId:
          type: string
        type:
          type: string
      required:
      - code
      - detail
      - errors
      - instance
      - status
      - title
      - traceId
      - type
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
