# Seed review cards — INTERVIEW
# Spec: docs/19-content-spec.md §3.5 (schema), §7.3 (작성 가이드)
# 면접 카드는 답변 "구조"를 떠올리는 카드다. 사용자 자신의 사례로 답한다
cards:
  - conceptKey: INTERVIEW.PROJECT_STORY.STAR_STRUCTURE
    skill: INTERVIEW.PROJECT_STORY
    reviewType: EXPLAIN
    prompt: >-
      "가장 기억에 남는 프로젝트를 설명해 주세요"라는 질문에 2분 안에 답하는 구조를 설명하고, 본인
      프로젝트 하나로 뼈대를 말해 보세요.
    expectedAnswer: >-
      STAR 구조로 답한다. Situation(서비스와 규모, 문제 배경), Task(내가 맡은 책임과 목표), Action(내가 직접
      한 설계와 구현, 그 선택의 이유), Result(수치나 전후 비교로 확인한 결과와 배운 점) 순서다. 팀 성과와
      본인 기여를 구분하고, 면접관이 이어서 물을 기술 주제(예: 트랜잭션 경계, 성능 개선 근거)를 Action에 한두
      개 심어 둔다.
    rubric:
      - id: R1
        criterion: STAR(Situation, Task, Action, Result) 구조
      - id: R2
        criterion: 팀 성과와 본인 기여를 구분한다
      - id: R3
        criterion: 결과를 수치나 비교로 제시한다
      - id: R4
        criterion: 후속 질문으로 이어질 기술 주제를 준비한다

  - conceptKey: INTERVIEW.TECH_DECISION.TRADEOFF_ANSWER
    skill: INTERVIEW.TECH_DECISION
    reviewType: EXPLAIN
    prompt: >-
      "왜 그 기술을 선택했나요?"라는 질문에 답하는 구조를 설명하고, 본인 프로젝트의 기술 선택 하나로 답해
      보세요.
    expectedAnswer: >-
      요구사항과 제약(규모, 일정, 팀 역량, 비용)을 먼저 말하고, 검토한 대안을 두 개 이상 비교 기준과 함께
      제시한다. 기준에 따라 선택한 이유를 말한 뒤, 감수한 단점과 그 단점을 어떻게 완화했는지, 조건이 바뀌면
      어떤 선택을 다시 검토할지까지 답한다. "많이 써서", "최신이라서"만으로 답하지 않는다.
    rubric:
      - id: R1
        criterion: 요구사항과 제약에서 출발한다
      - id: R2
        criterion: 대안 두 개 이상을 기준과 함께 비교한다
      - id: R3
        criterion: 감수한 단점과 완화 방법, 재검토 조건을 말한다

  - conceptKey: INTERVIEW.TROUBLESHOOTING_STORY.STRUCTURE
    skill: INTERVIEW.TROUBLESHOOTING_STORY
    reviewType: EXPLAIN
    prompt: >-
      "개발하면서 겪은 어려운 문제와 해결 과정을 말해 주세요"라는 질문에 답하는 순서를 설명하고, 본인 사례의
      뼈대를 말해 보세요.
    expectedAnswer: >-
      현상(무엇이 언제 어떻게 잘못되었는지와 영향), 가설(가능한 원인 후보), 검증(로그, 재현, 측정으로 가설을
      확인하거나 버린 과정), 원인, 해결(선택한 수정과 대안을 고르지 않은 이유), 재발 방지(테스트, 모니터링,
      규칙 추가), 배운 점 순서로 답한다. 추측이 아니라 확인한 근거를 중심으로 말한다.
    rubric:
      - id: R1
        criterion: 현상과 영향으로 시작한다
      - id: R2
        criterion: 가설과 검증 과정을 근거와 함께 말한다
      - id: R3
        criterion: 해결과 재발 방지를 구분한다

  - conceptKey: INTERVIEW.CAREER_MOTIVATION.ANSWER_STRUCTURE
    skill: INTERVIEW.CAREER_MOTIVATION
    reviewType: EXPLAIN
    prompt: >-
      "왜 이직하려고 하나요?" 또는 "왜 백엔드 개발자로 전환하나요?"라는 질문에 답하는 구조를 설명하고 본인
      답변의 뼈대를 말해 보세요.
    expectedAnswer: >-
      현재 회사나 동료에 대한 불만이 아니라 앞으로 하고 싶은 일과 목표를 중심으로 답한다. 그 목표를 위해
      이미 준비한 구체적인 행동(학습, 프로젝트, 결과물)을 근거로 들고, 지원한 회사와 직무가 그 목표와 어떻게
      맞는지 연결한다. 이전 경력에서 가져올 수 있는 강점도 한 가지 덧붙인다.
    rubric:
      - id: R1
        criterion: 불만이 아닌 목표 중심으로 답한다
      - id: R2
        criterion: 준비한 구체적 행동을 근거로 든다
      - id: R3
        criterion: 지원 회사·직무와 목표를 연결한다
