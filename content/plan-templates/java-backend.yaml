      - DATABASE.JPA.PERSISTENCE_CONTEXT
      - DATABASE.JPA.FETCH_STRATEGY
      - WEB_HTTP.HTTP_BASICS
      - WEB_HTTP.REST_API_DESIGN
  - key: TEST_DB_DEEP_DIVE
    title: 테스트·DB 심화
    description: 인덱스, 격리 수준, 락으로 데이터 정합성을 다루고 slice 테스트와 Testcontainers로 검증하는 방법을 익힌다.
    priority: MUST
    weightBp: 2000
    phase: PREPARATION
    skillCodes:
      - DATABASE.MODELING
      - DATABASE.INDEX
      - DATABASE.INDEX.EXPLAIN_PLAN
      - DATABASE.TRANSACTION
      - DATABASE.TRANSACTION.LOCKING
