    title: 배포·보안
    description: Docker와 GitHub Actions로 배포 파이프라인을 만들고, 인증·인가, 입력 검증, secret·로그 관리를 점검한다.
    priority: MUST
    weightBp: 1500
    phase: PREPARATION
    skillCodes:
      - DEVOPS.LINUX_BASICS
