# DevPilot plan template — JAVA_BACKEND
# Spec: docs/19-content-spec.md §3.4 (schema), §5 (날짜 배치 알고리즘)
# - milestones 순서 = plan_milestone.sort_order
# - PREPARATION milestone이 모두 APPLICATION milestone보다 앞에 온다
# - weightBp 전체 합 = 10000. 단계(phase) 안에서는 해당 단계 합으로 다시 나눠 쓴다
# - MUST role target skill은 정확히 한 milestone에 들어간다. 한 skill은 최대 한 milestone
templateKey: JAVA_BACKEND_DEFAULT
targetRole: JAVA_BACKEND
planTitle: Java 백엔드 이직 준비
placement:
  minMilestoneDays: 7
milestones:
  - key: JAVA_SQL_FOUNDATION
    title: Java·SQL 기초 다지기
    description: 예외, 컬렉션, Stream 같은 Java 핵심과 SQL 기초를 다지고, Git·Gradle·JUnit으로 작은 코드를 테스트와 함께 관리하는 습관을 만든다.
    priority: MUST
    weightBp: 1500
    phase: PREPARATION
    skillCodes:
      - JAVA.OOP
      - JAVA.COLLECTION
      - JAVA.GENERICS
      - JAVA.EXCEPTION
      - JAVA.EXCEPTION.TRY_WITH_RESOURCES
      - JAVA.LAMBDA_STREAM
      - JAVA.OPTIONAL
      - JAVA.MODERN_SYNTAX
      - PRACTICAL_ENGINEERING.NULL_BOUNDARY
      - DATABASE.SQL_BASICS
      - DEVOPS.GIT
      - DEVOPS.BUILD_GRADLE
      - TESTING.JUNIT
  - key: SPRING_JPA_CORE
    title: Spring·JPA 핵심
    description: DI, MVC, 검증, 예외 응답, 트랜잭션, JPA 영속성 컨텍스트와 N+1을 포트폴리오 API에 적용하며 익힌다.
    priority: MUST
    weightBp: 2500
    phase: PREPARATION
    skillCodes:
      - SPRING.DI_IOC
      - SPRING.BOOT_CONFIG
      - SPRING.MVC_REST
      - SPRING.VALIDATION
      - SPRING.EXCEPTION_HANDLING
      - SPRING.AOP_PROXY
      - SPRING.TRANSACTION
      - SPRING.DATA_JPA
